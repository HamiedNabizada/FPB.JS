name: Tests

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  workflow_dispatch:

# Ein laufender Lauf pro Branch reicht, aeltere abbrechen
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # --ignore-scripts: das prepare-Script baut sonst vor jedem Lauf die
      # komplette Library, was die Unit-Tests nicht brauchen.
      - run: npm ci --ignore-scripts

      - run: npm run test:unit

  e2e:
    name: E2E-Tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - run: npx playwright install --with-deps chromium

      # Die Bibliothek (dist/fpbjs.js, fpbjs-aml.js): library-api, german und
      # weitere Specs laden sie; ohne --ignore-scripts baute prepare sie mit
      - run: npm run build:lib

      # Playwright startet den Dev-Server selbst (webServer in playwright.config.js)
      - run: npm run test:e2e

      - name: Report hochladen
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  examples:
    name: Beispiele
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - run: npm run build:lib

      # Das Paket dieses Branches, nicht die letzte Veroeffentlichung auf npm
      - run: npm pack --ignore-scripts

      # Die Beispiele haben bewusst kein Lockfile im Repo (.gitignore)
      - name: Beispiele gegen das Paket bauen
        run: |
          for example in starter event-export import-export; do
            (cd "examples/$example" && npm install && npm install --no-save ../../fpbjs-*.tgz && npm run build)
          done

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test tests/e2e/examples-smoke.spec.js --project=chromium

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - run: npm run build
