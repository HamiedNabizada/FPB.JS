<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="stylesheet" href="../css/fpbjs.css">
  <link rel="stylesheet" href="../css/dark-mode.css">


  <style>
    body,
    html {
      height: 100%;
      width: 100%;
      margin: 0;
    }

    /* the second row holds the sheet of narrow touch screens (016f E2);
       without an open sheet it is empty */
    .fpb-wrapper {
      height: 100vh;
      width: 100vw;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
    }

    .modeler-parent {
      display: grid;
      grid-template-columns: 1fr auto;
      position: relative;
      min-height: 0;
    }

    .side-panels {
      display: flex;
    }

    /* Narrow touch screens (tablet upright, phone): the panels float over
       the canvas instead of taking its width. Narrow desktop windows keep
       the panels beside the canvas. */
    @media (max-width: 900px) and (pointer: coarse) {
      .side-panels {
        position: absolute;
        top: 0;
        right: 0;
        height: 100%;
        z-index: 5;
      }

      #properties-container,
      #layer-container {
        background: rgba(250, 250, 250, 0.95);
      }

      /* the properties open as a sheet (016f E2): the side stays empty */
      #properties-container:empty {
        display: none;
      }

      /* a sheet makes the canvas low (016f E2): the toolbar goes on in a
         second column to the left instead of running onto the sheet */
      #layer-container {
        height: 100%;
      }

      #layer-container .fpb-toolbar {
        height: 100%;
        flex-wrap: wrap-reverse;
        align-content: flex-start;
      }
    }

    #properties-container {
      border-left: solid 1px #CCC;
      background: #FAFAFA;
      padding: 5px;
    }

    #layer-container {
      border-left: solid 1px #CCC;
      background: #FAFAFA;
      padding: 5px;
    }

    


  </style>
</head>

<body>
  
  <div class="fpb-wrapper">
    <div class="modeler-parent">
      <div id="modeler-container"></div>
      <div class="side-panels">
        <div id="properties-container"></div>
        <div id="layer-container"></div>
      </div>
    </div>
    <div id="sheet-container"></div>

  </div>


</body>

</html>
